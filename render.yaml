# Blueprint Render : site statique (Vite + React), déployé à chaque push sur main.
# Doc : https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: portfolio-ui-ux
    repo: https://github.com/Lornaah/Portfolio_UI_UX
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    # Application monopage : toutes les routes (/jeu, /jeu/talents…) servent index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Fichiers générés par Vite (nom avec empreinte) : cache long
      - path: /_app/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
