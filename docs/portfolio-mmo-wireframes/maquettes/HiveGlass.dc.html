<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ruche vitrail, variantes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#2a2a28}
.s-hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.s-hexp{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.btn{background:transparent;border:0;padding:0;cursor:pointer;font:inherit;color:#2a2a28}
.cell .pane{transform:rotate(var(--r,0deg));transition:transform .22s cubic-bezier(.3,1.6,.5,1);animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--d,0s)}
.cell .glassin{transition:background-color .2s}
.cell:hover{z-index:30}
.cell:hover .pane{transform:translateY(-8px) rotate(0deg) scale(1.15)}
.cell:hover .glassin{background:#ffffff}
.cell:active .pane{transform:rotate(0deg) scale(.95)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.5)}}
.tipc{position:absolute;bottom:calc(100% + 16px);left:50%;width:220px;box-sizing:border-box;transform:translate(-50%,8px);opacity:0;pointer-events:none;transition:opacity .15s,transform .2s;background:#2a2a28;color:#f4f4f2;padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;border-radius:10px 10px 10px 0}
.cell:hover .tipc{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1440px; height: 1440px; background: #d6d6d2; display: flex; flex-direction: column">
  <sc-for list="{{bands}}" as="b" hint-placeholder-count="4">
    <section style="height: 360px; position: relative; border-bottom: 2px dashed #8a8a86; box-sizing: border-box">
      <div style="position: absolute; left: 48px; top: 24px; width: 240px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 800; letter-spacing: .16em">{{b.n}}</span>
        <span style="font-size: 22px; font-weight: 800; line-height: 1.1">{{b.title}}</span>
        <span style="font-size: 12px; line-height: 1.45">{{b.text}}</span>
      </div>
      <svg width="1440" height="360" viewBox="0 0 1440 360" style="position: absolute; left: 0; top: 0" aria-hidden="true">
        <path d="{{b.frame}}" fill="{{b.frameFill}}" stroke="#2a2a28" stroke-width="{{b.frameW}}" stroke-linejoin="round"/>
        <path d="{{b.glass}}" fill="{{b.glassFill}}" stroke="#b9b9b5" stroke-width="{{b.glassW}}" stroke-linejoin="round"/>
        <path d="{{b.leads}}" fill="none" stroke="#2a2a28" stroke-width="3"/>
      </svg>
      <sc-for list="{{b.cells}}" as="s" hint-placeholder-count="9">
        <button type="button" class="btn cell" aria-label="{{s.label}}, touche {{s.key}}" style="{{s.wrap}}">
          <span class="tipc"><b style="font-size: 14px">{{s.label}}</b><span style="font-size: 11px; opacity: .8">Sort instantané · touche {{s.key}}</span><span style="font-size: 12px; line-height: 1.4">{{s.desc}}</span></span>
          <span class="pane" style="{{s.box}}">
            <span class="{{s.cls}}" style="position: absolute; inset: -2px; background: #2a2a28"></span>
            <span class="{{s.cls}} glassin" style="position: absolute; inset: 2px; background: #e6e6e2"></span>
            <svg width="{{s.w}}" height="{{s.h}}" style="position: absolute; left: 0; top: 0" aria-hidden="true">
              <path d="{{s.facets}}" stroke="#8a8a86" stroke-width="1.5"/>
              <circle cx="{{s.cx}}" cy="{{s.cy}}" r="{{s.r2}}" fill="none" stroke="#2a2a28" stroke-width="1.5"/>
              <circle cx="{{s.cx}}" cy="{{s.cy}}" r="{{s.r}}" fill="#f4f4f2" stroke="#2a2a28" stroke-width="1.5"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="#2a2a28" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="{{s.iconStyle}}" aria-hidden="true"><path d="{{s.icon}}"/></svg>
            <span style="{{s.keyStyle}}">{{s.key}}</span>
          </span>
        </button>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    var defs = [
      ['P', 'Personnage', 'Ma fiche : caractéristiques, profil, équipement.', 'M12 4a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7M5 20c0-4 3-6 7-6s7 2 7 6'],
      ['O', 'Origines', 'D’où je viens : langues, enseignement, code.', 'M12 21V10M12 10C12 6 9 4 5 4c0 4 3 6 7 6M12 14c0-3 3-5 7-5c0 4-3 5-7 5'],
      ['R', 'Réputation', 'Mes clients et ce qu’ils disent.', 'M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z'],
      ['T', 'Talents', 'Trois arbres : UI/UX, dev, illustration.', 'M12 21v-7M12 14l-5-5M12 14l5-5M12 11V4M7 9V6M17 9V6'],
      ['F', 'Faits d’armes', 'Mes projets, du rare au légendaire.', 'M8 4h8v5a4 4 0 0 1-8 0zM8 6H5c0 3 1 4 3 4M16 6h3c0 3-1 4-3 4M12 13v4M8 20h8'],
      ['O', 'Objectifs', 'Ce que je cherche en ce moment.', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8'],
      ['L', 'Lettres', 'Écrivez-moi, je réponds vite.', 'M3 6h18v12H3zM3 7l9 7 9-7'],
      ['I', 'Inventaire', 'Mes outils du quotidien.', 'M6 9h12l1 11H5zM9 9V7a3 3 0 0 1 6 0v2'],
      ['O', 'Options', 'Son, version texte, CV.', 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2']
    ];
    var f1 = function (n) { return n.toFixed(1); };
    function mk(i, x, y, w, h, pointy, rot) {
      var d = defs[i];
      var V = pointy ? [[w / 2, 0], [w, h * 0.25], [w, h * 0.75], [w / 2, h], [0, h * 0.75], [0, h * 0.25]] : [[w * 0.25, 0], [w * 0.75, 0], [w, h / 2], [w * 0.75, h], [w * 0.25, h], [0, h / 2]];
      var cx = w / 2, cy = h * 0.44, r = Math.min(w, h) * 0.24, ic = r * 1.25;
      return { key: d[0], label: d[1], desc: d[2], icon: d[3], cls: pointy ? 's-hexp' : 's-hex',
        w: f1(w), h: f1(h), cx: f1(cx), cy: f1(cy), r: f1(r), r2: i === 4 ? f1(r + 6) : 0,
        facets: V.map(function (v) { return 'M' + f1(v[0]) + ' ' + f1(v[1]) + 'L' + f1(cx) + ' ' + f1(cy); }).join(''),
        wrap: 'position: absolute; left: ' + f1(x) + 'px; top: ' + f1(y) + 'px; width: ' + f1(w) + 'px; height: ' + f1(h) + 'px;',
        box: '--r: ' + rot + 'deg; --d: ' + (i * 0.06).toFixed(2) + 's; position: absolute; inset: 0; display: block;',
        iconStyle: 'position: absolute; left: ' + f1(cx - ic / 2) + 'px; top: ' + f1(cy - ic / 2) + 'px; width: ' + f1(ic) + 'px; height: ' + f1(ic) + 'px;',
        keyStyle: 'position: absolute; left: 50%; bottom: ' + f1(h * (pointy ? 0.12 : 0.06)) + 'px; transform: translateX(-50%); min-width: 18px; padding: 0 4px; box-sizing: border-box; background: #2a2a28; color: #f4f4f2; font-size: ' + Math.round(Math.max(11, w * 0.14)) + 'px; font-weight: 800; line-height: 1.35; text-align: center; border-radius: 4px;' };
    }
    function archRect(x, y, w, h, r) {
      return 'M' + x + ' ' + (y + h) + 'L' + x + ' ' + (y + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + r) + ' ' + y + 'L' + (x + w - r) + ' ' + y + 'A' + r + ' ' + r + ' 0 0 1 ' + (x + w) + ' ' + (y + r) + 'L' + (x + w) + ' ' + (y + h) + 'Z ';
    }

    /* 1. Ogive : la ruche suit un arc */
    var c1 = [], l1 = '';
    for (var i = 0; i < 9; i++) {
      var k = i - 4, w = i === 4 ? 108 : 84, h = i === 4 ? 96 : 76;
      var cx = 760 + k * 74, cy = 150 + k * k * 5 + (i % 2 ? 18 : -18);
      c1.push(mk(i, cx - w / 2, cy - h / 2, w, h, false, k * 4));
      var by = 150 + k * k * 5;
      l1 += 'M' + cx + ' ' + (by - 62) + 'L' + cx + ' ' + (by + 62) + ' ';
    }
    var arc = 'M410 262 Q760 38 1110 262';

    /* 2. Triptyque : PORT | F | OLIO */
    var c2 = [], lx = 394, rx = 884;
    [0, 1, 2, 3].forEach(function (j) { c2.push(mk(j, lx + j * 66, 138 + (j % 2 ? 38 : 0), 84, 76, false, 0)); });
    c2.push(mk(4, 722, 150, 116, 104, false, 0));
    [5, 6, 7, 8].forEach(function (j, n) { c2.push(mk(j, rx + n * 66, 138 + (n % 2 ? 38 : 0), 84, 76, false, 0)); });
    var frame2 = archRect(380, 106, 310, 176, 70) + archRect(706, 66, 148, 236, 74) + archRect(870, 106, 310, 176, 70);
    var glass2 = archRect(387, 113, 296, 162, 63) + archRect(713, 73, 134, 222, 67) + archRect(877, 113, 296, 162, 63);
    var l2 = 'M387 195L683 195 M877 195L1173 195 M780 73L780 150 M713 202L847 202 M535 113L535 275 M1025 113L1025 275 ';

    /* 3. Éclats : tailles inégales dans une verrière brisée */
    var ws = [100, 68, 68, 100, 128, 68, 76, 68, 68], rots = [-4, 5, -3, 4, 0, -5, 3, -4, 5];
    var c3 = [], l3 = '', cur = 420;
    ws.forEach(function (w3, j) {
      var h3 = w3 * 0.9, yc = 190 + (j % 2 ? 26 : -26);
      c3.push(mk(j, cur, yc - h3 / 2, w3, h3, false, rots[j]));
      var ccx = cur + w3 / 2;
      l3 += j % 2 ? 'M' + f1(ccx) + ' ' + yc + 'L' + f1(ccx + (j - 4) * 8) + ' 290 ' : 'M' + f1(ccx) + ' ' + yc + 'L' + f1(ccx + (j - 4) * 8) + ' 96 ';
      cur += w3 * 0.8;
    });
    var P3 = [[392, 150], [430, 96], [560, 84], [700, 70], [860, 92], [1010, 84], [1062, 140], [1050, 250], [980, 300], [820, 286], [700, 312], [540, 296], [420, 280]];
    var poly = function (pts) { return 'M' + pts.map(function (p) { return f1(p[0]) + ' ' + f1(p[1]); }).join('L') + 'Z'; };
    var glass3 = poly(P3.map(function (p) { return [726 + (p[0] - 726) * 0.975, 190 + (p[1] - 190) * 0.93]; }));
    l3 += 'M392 150L470 190 M1062 140L990 190 M700 312L720 250 M700 70L712 130 ';

    /* 4. Dentelle : hexagones pointe en haut, sans cadre */
    var c4 = [], ox = 512, d4 = '', g4 = '';
    for (var m = 0; m < 9; m++) { c4.push(mk(m, ox + m * 50, m % 2 ? 154 : 70, 96, 110, true, 0)); }
    var dia = function (x, y, s) { return 'M' + x + ' ' + (y - s) + 'L' + (x + s) + ' ' + y + 'L' + x + ' ' + (y + s) + 'L' + (x - s) + ' ' + y + 'Z '; };
    [0, 2, 4, 6].forEach(function (j) { d4 += dia(ox + j * 50 + 98, 80, 13); g4 += dia(ox + j * 50 + 98, 80, 8); });
    [1, 3, 5].forEach(function (j) { d4 += dia(ox + j * 50 + 98, 254, 13); g4 += dia(ox + j * 50 + 98, 254, 8); });
    d4 += dia(ox - 14, 125, 13) + dia(ox + 510, 125, 13); g4 += dia(ox - 14, 125, 8) + dia(ox + 510, 125, 8);

    return { bands: [
      { n: 'VARIANTE 1', title: 'L’ogive', text: 'La ruche suit un arc de voûte. Le F, plus grand, est la clé de voûte. Les sorts s’inclinent le long de l’arc.', frame: arc, frameFill: 'none', frameW: 152, glass: arc, glassFill: 'none', glassW: 140, leads: l1, cells: c1 },
      { n: 'VARIANTE 2', title: 'Le triptyque', text: 'Trois baies : PORT (qui je suis), le F seul dans la baie centrale, OLIO (ce que je fais). Chaque baie garde son zigzag.', frame: frame2, frameFill: '#2a2a28', frameW: 0, glass: glass2, glassFill: '#b9b9b5', glassW: 0, leads: l2, cells: c2 },
      { n: 'VARIANTE 3', title: 'La verrière éclatée', text: 'Des hexagones de tailles inégales, serrés et de travers, pris dans un cadre irrégulier. Les plombs partent en éclats.', frame: poly(P3), frameFill: '#2a2a28', frameW: 0, glass: glass3, glassFill: '#b9b9b5', glassW: 0, leads: l3, cells: c3 },
      { n: 'VARIANTE 4', title: 'La dentelle', text: 'Pas de cadre : des hexagones pointe en haut, emboîtés sur deux rangs serrés. De petits losanges de verre comblent les creux.', frame: d4, frameFill: '#2a2a28', frameW: 0, glass: g4, glassFill: '#e6e6e2', glassW: 0, leads: '', cells: c4 }
    ] };
  }
}
</script>
</body>
</html>
